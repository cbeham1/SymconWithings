<svg xmlns="http://www.w3.org/2000/svg" width="760" height="597" viewBox="0 0 760 597"><rect x="0.5" y="0.5" width="759" height="596" rx="10" fill="#ffffff" stroke="#d0d7de"/><path d="M0.5 10.5 a10 10 0 0 1 10 -10 h739 a10 10 0 0 1 10 10 v70 h-759 z" fill="#24323d"/><text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="start">Withings Developer Dashboard – Create an application</text><text x="740" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb3c2" font-weight="normal" text-anchor="end">Schritt 2: Information</text><rect x="20" y="44" width="720" height="22" rx="11" fill="#3a4a56"/><text x="36" y="59" font-family="Consolas, Menlo, monospace" font-size="12" fill="#dfe7ec" font-weight="normal" text-anchor="start">https://developer.withings.com/dashboard/</text><text x="40" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">Vorher in Schritt 1 „Public API integration“ wählen und die Nutzungsbedingungen bestätigen.</text><circle cx="24" cy="128" r="11" fill="#e8590c"/><text x="24" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="40" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Target environment</text><rect x="40" y="132" width="300" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Development</text><circle cx="24" cy="184" r="11" fill="#e8590c"/><text x="24" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="40" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Application name</text><rect x="40" y="188" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">IP-Symcon Waage</text><text x="40" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Application description</text><rect x="40" y="244" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Private Anbindung meiner Withings-Waage an IP-Symcon</text><circle cx="24" cy="296" r="11" fill="#e8590c"/><text x="24" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="40" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Registered URLs</text><rect x="40" y="300" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="319" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">https://0123456789abcdef0123456789abcdef.ipmagic.de/hook/Withings12345</text><rect x="40" y="338" width="61" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="70" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">TEST</text><rect x="111" y="338" width="191" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="206" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">REGISTER ANOTHER URL</text><circle cx="47" cy="391" r="6" fill="#1a7f37"/><text x="60" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start">URL OK</text><circle cx="24" cy="424" r="11" fill="#e8590c"/><text x="24" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><rect x="40" y="410" width="61" height="30" rx="4" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><text x="70" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">DONE</text><line x1="20" y1="456" x2="740" y2="456" stroke="#d0d7de"/><circle cx="30" cy="476" r="11" fill="#e8590c"/><text x="30" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="481" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">„Development“ genügt für die private Nutzung im eigenen Haushalt.</text><circle cx="30" cy="501" r="11" fill="#e8590c"/><text x="30" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Name frei wählbar – erscheint später auf der Zustimmungsseite von Withings.</text><circle cx="30" cy="526" r="11" fill="#e8590c"/><text x="30" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="531" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Callback-URL aus dem Symcon-Formular zeichengenau einfügen (https, kein Schrägstrich am Ende).</text><text x="50" y="548" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Weitere Personen: „Register another url“.</text><circle cx="30" cy="568" r="11" fill="#e8590c"/><text x="30" y="572" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="50" y="573" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">„Test“ ist optional; „Done“ speichert die App.</text></svg>
