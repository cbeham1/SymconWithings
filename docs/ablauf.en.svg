, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">IP-Symcon</text><rect x="230" y="396" width="510" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="244" y="419" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Enter client ID and client secret in the instance, apply</text><circle cx="38" cy="416" r="11" fill="#e8590c"/><text x="38" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">6</text><path d="M38 428.0 V456" stroke="#59636e" stroke-width="1.5"/><rect x="70" y="450" width="150" height="54" rx="6" fill="#e7f0ff" stroke="#d0d7de" stroke-width="1.2"/><text x="145" y="481" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Browser</text><rect x="230" y="450" width="510" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="244" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">"Authorize at Withings" → sign in with the person's Withings</text><text x="244" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">account → allow access</text><circle cx="38" cy="477" r="11" fill="#e8590c"/><text x="38" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">7</text><path d="M38 489.0 V524" stroke="#59636e" stroke-width="1.5"/><rect x="70" y="518" width="150" height="54" rx="6" fill="#e0f2f1" stroke="#d0d7de" stroke-width="1.2"/><text x="145" y="549" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">IP-Symcon</text><rect x="230" y="518" width="