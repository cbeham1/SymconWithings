<svg xmlns="http://www.w3.org/2000/svg" width="760" height="873" viewBox="0 0 760 873"><rect x="0.5" y="0.5" width="759" height="872" rx="10" fill="#ffffff" stroke="#d0d7de"/><path d="M0.5 10.5 a10 10 0 0 1 10 -10 h739 a10 10 0 0 1 10 10 v40 h-759 z" fill="#24323d"/><text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="start">Withings Anna</text><text x="740" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb3c2" font-weight="normal" text-anchor="end">Withings Scale</text><text x="56" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">Lege unter developer.withings.com eine App an (Public API integration) und trage dort die unter</text><text x="56" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">den Einstellungen angezeigte Callback-URL ein.</text><circle cx="40" cy="152" r="11" fill="#e8590c"/><text x="40" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="56" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Client-ID</text><rect x="56" y="156" width="648" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="66" y="175" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">3f9c1e…a7d2</text><circle cx="40" cy="208" r="11" fill="#e8590c"/><text x="40" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="56" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Client-Secret</text><rect x="56" y="212" width="648" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="66" y="231" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">••••••••••••</text><text x="56" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Eigene Callback-URL (leer = Symcon Connect)</text><rect x="56" y="268" width="648" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="66" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start"></text><rect x="40" y="60" width="680" height="250" rx="6" fill="none" stroke="#d0d7de" stroke-width="1.2"/><path d="M41 66 a5 5 0 0 1 5 -5 h668 a5 5 0 0 1 5 5 v24 h-678 z" fill="#eef3f6"/><text x="54" y="81" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="bold" text-anchor="start">▾  Withings-Entwickler-App</text><text x="40" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Abfrageintervall (0 = nur manuell oder per Benachrichtigung)</text><rect x="40" y="338" width="220" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="357" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">30 min</text><circle cx="24" cy="390" r="11" fill="#e8590c"/><text x="24" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><path d="M44 387 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="66" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Withings meldet neue Messungen sofort (benötigt Symcon Connect)</text><rect x="40" y="407" width="16" height="16" rx="3" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><path d="M44 415 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="66" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Messungen ignorieren, die die Waage nicht sicher dieser Person zuordnen konnte</text><rect x="56" y="471" width="16" height="16" rx="3" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><path d="M60 479 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="82" y="484" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Statuskachel anlegen (HTML-Box für die Kachel-Visualisierung)</text><text x="56" y="508" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Design</text><rect x="56" y="514" width="200" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="66" y="533" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Automatisch (Design der …</text><text x="270" y="508" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Zeitraum des Gewichtsverlaufs</text><rect x="270" y="514" width="200" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="280" y="533" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">30</text><text x="484" y="508" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Zielgewicht (0 = keines)</text><rect x="484" y="514" width="200" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="494" y="533" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">78 kg</text><rect x="40" y="432" width="680" height="124" rx="6" fill="none" stroke="#d0d7de" stroke-width="1.2"/><path d="M41 438 a5 5 0 0 1 5 -5 h668 a5 5 0 0 1 5 5 v24 h-678 z" fill="#eef3f6"/><text x="54" y="453" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="bold" text-anchor="start">▾  Statuskachel</text><text x="40" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">Noch nicht autorisiert: Übernehmen, dann „Bei Withings autorisieren“ klicken</text><circle cx="24" cy="614" r="11" fill="#e8590c"/><text x="24" y="618" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="40" y="612" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Callback-URL für die Withings-Entwickler-App</text><rect x="40" y="618" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="637" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">https://0123456789abcdef0123456789abcdef.ipmagic.de/hook/Withings12345</text><circle cx="24" cy="670" r="11" fill="#e8590c"/><text x="24" y="674" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><rect x="40" y="656" width="232" height="30" rx="4" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><text x="156" y="676" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">BEI WITHINGS AUTORISIEREN</text><rect x="282" y="656" width="183" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="374" y="676" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">JETZT AKTUALISIEREN</text><rect x="475" y="656" width="208" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="579" y="676" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">MESSWERTE NEU EINLESEN</text><circle cx="47" cy="709" r="6" fill="#bc4c00"/><text x="60" y="714" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#bc4c00" font-weight="bold" text-anchor="start">Autorisierung bei Withings erforderlich</text><line x1="20" y1="732" x2="740" y2="732" stroke="#d0d7de"/><circle cx="30" cy="752" r="11" fill="#e8590c"/><text x="30" y="756" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="757" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Nach dem ersten Übernehmen steht hier die Callback-URL – im Withings-Portal unter „Registered URLs“</text><text x="50" y="774" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">eintragen.</text><circle cx="30" cy="794" r="11" fill="#e8590c"/><text x="30" y="798" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="799" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Client-ID und Secret aus dem Portal einfügen, „Eigene Callback-URL“ leer lassen, Übernehmen.</text><circle cx="30" cy="819" r="11" fill="#e8590c"/><text x="30" y="824" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="824" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Öffnet die Withings-Anmeldung. Nach „Erlauben“ wechselt der Status auf „Autorisiert“.</text><circle cx="30" cy="844" r="11" fill="#e8590c"/><text x="30" y="848" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="50" y="849" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Sofortmeldung: Withings meldet neue Messungen, Werte sind nach wenigen Sekunden da.</text></svg>
